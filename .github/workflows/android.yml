
name: Build CubeEvil4 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build game core
        run: |
          export RE4_JOBS=2
          bash port/tools/whole_build_android.sh

      - name: Build Android APK
        working-directory: port/android-decomp
        run: |
          chmod +x gradlew
          ./gradlew assembleCoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-Android-APK
          path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
          if-no-files-found: error
